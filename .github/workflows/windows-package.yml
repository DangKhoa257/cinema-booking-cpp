name: Windows Qt package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-qt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and matching MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
      - name: Locate MinGW
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "$env:RUNNER_WORKSPACE/Qt/Tools" -Directory -Filter 'mingw1310*' | Select-Object -First 1
          if (-not $mingw) { throw 'Matching MinGW was not installed' }
          "MINGW_BIN=$($mingw.FullName)/bin" >> $env:GITHUB_ENV
          "$($mingw.FullName)/bin" >> $env:GITHUB_PATH
      - name: Configure Release
        run: cmake -S . -B build-win -G Ninja -DBUILD_QT_GUI=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DCMAKE_CXX_COMPILER="${{ env.MINGW_BIN }}/g++.exe"
      - name: Build
        run: cmake --build build-win
      - name: Test
        run: ctest --test-dir build-win --output-on-failure
      - name: Package
        shell: pwsh
        run: ./scripts/package_windows.ps1 -BuildDir build-win -QtRoot "$env:QT_ROOT_DIR" -MingwBin "$env:MINGW_BIN"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OOPCinema-Windows-x64
          path: dist/OOPCinema-Windows-x64.zip
          if-no-files-found: error
